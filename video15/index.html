<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>style</title>
    <link rel="stylesheet" href="style.css">
    <style>
        pre{
            color:pink;
            background-color: aquamarine;
        }
    </style>
</head>
<body>
    <h1>There way to add CSS to HTML</h1>
    <ol>
        <li>Inline</li>
        <li>Internal</li>
        <li>External</li>
    </ol>

    <div style="color:red; background-color:yellow;">1.this line coloured by using a inline style</div>

    <pre>2.This line is coloured by using a internal style</pre>
    <span>3.This line coloursd by using a External style</span>
</body>
</html>
