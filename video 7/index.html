<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms-learn it</title>
</head>

<body>
    <h1>Form to apply web development course</h1>

    <form action=" post">
        <div>
            <label for="username">Enter user name</label>
            <input type="text" id="username" name="username" placeholder="Enter user name">
        </div>
        <div>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
        </div>
        <div>
            <input type="checkbox" id="subscribe" name="subscribe" value="yes">
            <label for="subscribe">subscribe to channel</label>
        </div>
        <div>
            <label for="comment">Enter your comment</label>
            <br>
            <textarea name="comment" id="comment" rows="5" cols="50"></textarea>
        </div>
        <div>
            <select name="Fruits">
                <option value="apple">Apple</option>
                <option value="banana">Banana</option>
                <option value="orange">Orange</option>
                <option value="grapes">Grapes</option>
                <option value="mango">Mango</option>
            </select>
        </div>

    </form>
</body>

</html>
